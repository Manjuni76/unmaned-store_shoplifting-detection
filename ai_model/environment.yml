name: shoplifting_train
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
    # PyTorch with CUDA 12.9 (RTX 5080 지원)
    - torch==2.8.0
    - torchvision==0.23.0
    - --index-url https://download.pytorch.org/whl/cu129
    
    # 컴퓨터 비전
    - ultralytics==8.3.203
    - opencv-python==4.9.0.80
    
    # 데이터 처리
    - numpy==1.24.3
    - scipy==1.10.1
    - pandas==2.0.3
    
    # 머신러닝
    - scikit-learn==1.4.0
    
    # 시각화
    - matplotlib==3.8.2
    - seaborn==0.13.1
    
    # 유틸리티
    - tqdm==4.66.1
    - pillow
    - pyyaml
    - requests
    
    # Ultralytics 의존성
    - psutil
    - polars
    - ultralytics-thop
